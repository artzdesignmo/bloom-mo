<!DOCTYPE html>
<html lang="en" data-theme="silver">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bloom Mo — Generative Botanical Studio</title>
<meta name="description" content="Bloom Mo: every flower grown from code. Japanese watercolor style, stipple shading.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8e8e6; --panel:#f7f7f5; --card:#ffffff; --ink:#1c1c1e; --ink2:#6b6b6e;
  --line:#d8d8d4; --accent:#2d6a4f; --radius:14px;
}
[data-theme="white"]{ --bg:#f4f4f4; --panel:#ffffff; --card:#ffffff; --ink:#1c1c1e; --ink2:#6b6b6e; --line:#e2e2e2; }
[data-theme="black"]{ --bg:#141414; --panel:#1e1e1e; --card:#242424; --ink:#f2f2f2; --ink2:#a8a8a8; --line:#333; }
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; overflow:hidden; }
body{ font-family:'Noto Sans TC','Noto Sans',sans-serif; background:var(--bg); color:var(--ink); }
#cv{ position:fixed; inset:0; width:100vw; height:100vh; cursor:crosshair; display:block; }
/* settings gear */
#gear{
  position:fixed; top:14px; left:14px; z-index:60;
  width:44px; height:44px; border-radius:50%;
  border:1px solid var(--line); background:var(--card); color:var(--ink);
  font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  box-shadow:0 2px 10px rgba(0,0,0,.12);
}
#gear:hover{ border-color:var(--ink2); }
/* slide-in panel */
#panel{
  position:fixed; top:0; left:0; bottom:0; z-index:55;
  width:min(340px,88vw); background:var(--panel); border-right:1px solid var(--line);
  transform:translateX(-105%); transition:transform .32s cubic-bezier(.32,.72,.28,1);
  overflow-y:auto; padding:70px 18px 24px; box-shadow:4px 0 24px rgba(0,0,0,.08);
}
#panel.open{ transform:translateX(0); }
#panel h1{ font-family:'Dela Gothic One'; font-size:20px; letter-spacing:1px; }
#panel .sub{ font-size:10px; color:var(--ink2); letter-spacing:3px; margin:2px 0 14px; }
.sec{ margin-top:16px; }
.sec .lbl{ font-size:11px; color:var(--ink2); letter-spacing:2px; margin-bottom:8px; }
.chips{ display:flex; flex-wrap:wrap; gap:7px; }
.chip{ border:1px solid var(--line); background:var(--card); border-radius:10px; padding:7px 12px; cursor:pointer; font-size:12.5px; color:var(--ink2); }
.chip.on{ border-color:var(--accent); color:var(--ink); font-weight:600; }
.slider-row{ margin:10px 0; }
.slider-row .row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
.slider-row .nm{ font-size:13px; }
.slider-row .val{ font-size:12px; color:var(--ink2); min-width:38px; text-align:right; }
input[type=range]{ width:100%; accent-color:var(--accent); cursor:pointer; }
.btns{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
.btn{ border:1px solid var(--line); background:var(--card); color:var(--ink); padding:9px 16px; border-radius:999px; cursor:pointer; font-size:13px; font-weight:500; }
.btn:hover{ border-color:var(--ink2); }
.btn.primary{ background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:700; }
.foot{ margin-top:22px; font-size:11px; color:var(--ink2); letter-spacing:1px; text-align:center; }
.foot a{ color:var(--ink2); }
.hctl{ display:flex; align-items:center; gap:8px; margin-top:6px; }
.seg{ display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--card); }
.seg button{ border:0; background:transparent; color:var(--ink2); padding:6px 12px; cursor:pointer; font-size:12px; font-weight:500; }
.seg button.on{ background:var(--ink); color:var(--bg); }
.tbtn{ width:30px; height:30px; border-radius:50%; border:1px solid var(--line); cursor:pointer; }
#scrim{
  position:fixed; inset:0; z-index:54; background:rgba(0,0,0,.18);
  opacity:0; pointer-events:none; transition:opacity .3s;
}
#scrim.show{ opacity:1; pointer-events:auto; }
/* hint bottom-left */
#hint{
  position:fixed; left:16px; bottom:14px; z-index:40;
  font-size:6px; color:var(--ink2); letter-spacing:1px; pointer-events:none;
  text-shadow:0 1px 4px rgba(255,255,255,.9), 0 0 8px rgba(255,255,255,.7);
}
[data-theme="black"] #hint{ text-shadow:0 1px 4px rgba(0,0,0,.9); }
#count{
  position:fixed; right:16px; bottom:14px; z-index:40;
  font-size:12px; color:var(--ink2); letter-spacing:1px; pointer-events:none;
  text-shadow:0 1px 4px rgba(255,255,255,.9);
}
[data-theme="black"] #count{ text-shadow:0 1px 4px rgba(0,0,0,.9); }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="gear" aria-label="settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a8a8e" stroke-width="1.7"><ellipse cx="12" cy="7" rx="2.4" ry="3.4"/><ellipse cx="12" cy="7" rx="2.4" ry="3.4" transform="rotate(72 12 12)"/><ellipse cx="12" cy="7" rx="2.4" ry="3.4" transform="rotate(144 12 12)"/><ellipse cx="12" cy="7" rx="2.4" ry="3.4" transform="rotate(216 12 12)"/><ellipse cx="12" cy="7" rx="2.4" ry="3.4" transform="rotate(288 12 12)"/><circle cx="12" cy="12" r="1.7"/></svg></button>
<div id="scrim"></div>
<aside id="panel">
  <h1>BLOOM MO</h1>
  <div class="sub">GENERATIVE BOTANICAL STUDIO</div>
  <div class="btns">
    <button class="btn primary" id="bGrow">🌱 Grow a flower</button>
    <button class="btn" id="bBouquet">💐 Surprise bouquet</button>
    <button class="btn" id="bClear">Clear</button>
    <button class="btn" id="bPng">Export PNG</button>
  </div>
  <div class="sec"><div class="lbl" id="lblSpecies">SPECIES</div><div class="chips" id="species"></div></div>
  <div class="sec"><div class="lbl" id="lblStyle">ART STYLE</div><div class="chips" id="styles"></div></div>
  <div class="sec"><div class="lbl" id="lblVase">VASE</div><div class="chips" id="vases"></div></div>
  <div class="sec"><div class="lbl" id="lblForm">FORM</div><div class="chips" id="forms"></div></div>
  <div class="sec"><div class="lbl" id="lblBg">BACKGROUND</div><div class="chips" id="bgs"></div></div>
  <div class="sec"><div class="lbl" id="lblTone">TONE</div><div class="chips" id="tones"></div></div>
  <div class="sec"><div class="lbl" id="lblGrow">GROWTH & STEM</div>
    <div class="slider-row"><div class="row"><span class="nm" id="nmSpeed">Growth speed</span><span class="val" id="vSpeed"></span></div><input type="range" id="sSpeed" min="20" max="500" value="222"></div>
    <div class="slider-row"><div class="row"><span class="nm" id="nmThick">Stem thickness</span><span class="val" id="vThick"></span></div><input type="range" id="sThick" min="40" max="300" value="60"></div>
    <div class="slider-row"><div class="row"><span class="nm" id="nmCurve">Stem curvature</span><span class="val" id="vCurve"></span></div><input type="range" id="sCurve" min="90" max="180" step="1" value="105"></div>
    <div class="slider-row"><div class="row"><span class="nm" id="nmLen">Stem length</span><span class="val" id="vLen"></span></div><input type="range" id="sLen" min="50" max="150" value="100"></div>
    <div class="slider-row"><div class="row"><span class="nm" id="nmCount">Flowers per stem</span><span class="val" id="vCount"></span></div><input type="range" id="sCount" min="1" max="5" step="1" value="1"></div>
    <div class="slider-row"><div class="row"><span class="nm" id="nmSize">Flower size</span><span class="val" id="vSize"></span></div><input type="range" id="sSize" min="50" max="300" value="100"></div>
  </div>
  <div class="sec"><div class="lbl" id="lblPref">PREFERENCES</div>
    <div class="hctl">
      <div class="seg" id="langSeg"><button data-l="en" class="on">EN</button><button data-l="zh">中</button></div>
      <button class="tbtn" data-th="white" style="background:#fff" title="white"></button>
      <button class="tbtn" data-th="silver" style="background:#d8d8d8" title="silver"></button>
      <button class="tbtn" data-th="black" style="background:#222" title="black"></button>
    </div>
  </div>
  <div class="foot">BLOOM MO · <span id="footTx"></span> · <a href="https://buymeacoffee.com/whynotartmoney" target="_blank" rel="noopener">Buy Me a Coffee</a></div>
</aside>
<div id="hint"></div>
<div id="count"></div>
<script>
/* ================= i18n ================= */
const STR={
  en:{grow:'🌱 Grow a flower',bouquet:'💐 Surprise bouquet',clear:'Clear',png:'Export PNG',
      hint:'click the garden to drop a seed · every bloom is unique',foot:'every flower grown from code',
      count:n=>n+(n===1?' bloom':' blooms'),species:'SPECIES',bg:'BACKGROUND',tone:'TONE',growSec:'GROWTH & STEM',pref:'PREFERENCES',
      speed:'Growth speed',thick:'Stem thickness',curve:'Stem curvature',len:'Stem length',fcount:'Flowers per stem',size:'Flower size',
      tones:['Color','Mono','B&W'],
      style:'ART STYLE',vase:'VASE',
      styles:[{n:'Watercolor'},{n:'Flat Geo'},{n:'Pop'},{n:'Risograph'},{n:'Dream Blur'},{n:'Line'}],
      vases:[{n:'None'},{n:'Blue Round'},{n:'Mustard Zigzag'},{n:'Orange Round'},{n:'Green Bottle'},{n:'Pink Jug'},{n:'Wavy'},{n:'Bubble'},{n:'Ribbed'},{n:'Pink Round'}],
      form:'FORM',
      forms:[{n:'Radial'},{n:'Cup'},{n:'Pom'},{n:'Spike'}],
      bgs:['Sunny sky','Light green','Gray dots','Watercolor paper','Concrete wall','Rainy day','Cloudy','Black','White']},
  zh:{grow:'🌱 種一朵花',bouquet:'💐 驚喜花束',clear:'清空',png:'匯出 PNG',
      hint:'點擊花園掉下種子 · 每朵都獨一無二',foot:'每朵花都由代碼種出',
      count:n=>n+' 朵花',species:'花種',bg:'背景',tone:'色調',growSec:'生長與花枝',pref:'偏好設定',
      speed:'生長速度',thick:'花枝粗細',curve:'花枝彎曲度',len:'花枝長度',fcount:'每枝花朵數',size:'花朵大小',
      tones:['彩色','單色','黑白'],
      style:'畫風',vase:'花瓶',
      styles:[{n:'水彩'},{n:'扁平幾何'},{n:'普普'},{n:'孔版印刷'},{n:'柔焦'},{n:'線條'}],
      vases:[{n:'無'},{n:'藍圓瓶'},{n:'芥末鋸齒瓶'},{n:'橙紅圓瓶'},{n:'深綠細頸瓶'},{n:'粉紅把手壺'},{n:'波浪瓶'},{n:'泡泡瓶'},{n:'玻璃紋瓶'},{n:'粉圓瓶'}],
      form:'形態',
      forms:[{n:'放射'},{n:'杯狀'},{n:'球狀'},{n:'穗狀'}],
      bgs:['淺藍天晴天','淺綠','淺灰加點點','水彩紙','水泥牆','下雨天','陰天','黑色','白色']}
};
let lang='en';
const t=k=>STR[lang][k];
function applyLang(){
  document.documentElement.lang=lang==='zh'?'zh-Hant':'en';
  document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  document.getElementById('bGrow').textContent=t('grow');
  document.getElementById('bBouquet').textContent=t('bouquet');
  document.getElementById('bClear').textContent=t('clear');
  document.getElementById('bPng').textContent=t('png');
  document.getElementById('hint').textContent=t('hint');
  document.getElementById('footTx').textContent=t('foot');
  document.getElementById('lblSpecies').textContent=t('species');
  document.getElementById('lblStyle').textContent=t('style');
  document.getElementById('lblVase').textContent=t('vase');
  document.getElementById('lblForm').textContent=t('form');
  document.getElementById('lblBg').textContent=t('bg');
  document.getElementById('lblTone').textContent=t('tone');
  document.getElementById('lblGrow').textContent=t('growSec');
  document.getElementById('lblPref').textContent=t('pref');
  document.getElementById('nmSpeed').textContent=t('speed');
  document.getElementById('nmThick').textContent=t('thick');
  document.getElementById('nmCurve').textContent=t('curve');
  document.getElementById('nmLen').textContent=t('len');
  document.getElementById('nmCount').textContent=t('fcount');
  document.getElementById('nmSize').textContent=t('size');
  updateCount();buildSpecies();buildStyles();buildVases();buildForms();buildBgs();buildTones();
}
document.querySelectorAll('#langSeg button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;applyLang();});
/* ================= theme ================= */
function applyTheme(th){
  if(th) document.documentElement.dataset.theme=th;
  try{localStorage.setItem('bloommo-theme',document.documentElement.dataset.theme);}catch(e){}
}
document.querySelectorAll('.tbtn').forEach(b=>b.onclick=()=>applyTheme(b.dataset.th));
try{const s=localStorage.getItem('bloommo-theme');if(s)document.documentElement.dataset.theme=s;}catch(e){}

/* ================= species ================= */
const SPECIES=[
  {id:'rose',em:'🌹',en:'Rose',zh:'玫瑰',petals:[24,34],layers:3,shape:'round',cols:[['#a83a4a','#d9707f'],['#c0507a','#e89aac']],center:['#6b2230','#401420'],ink:'#4a1a22'},
  {id:'sakura',em:'🌸',en:'Cherry Blossom',zh:'櫻花',petals:[5,5],layers:1,shape:'notch',cols:[['#e8a0b4','#f7d4dd']],center:['#c94f6d','#8e2f45'],ink:'#7a3040'},
  {id:'sunflower',em:'🌻',en:'Sunflower',zh:'向日葵',petals:[20,28],layers:2,shape:'narrow',cols:[['#d9940d','#f5c542']],center:['#5c3a10','#3d2608'],ink:'#6b4a10'},
  {id:'orchid',em:'🌺',en:'Orchid',zh:'蘭花',petals:[6,6],layers:1,shape:'exotic',cols:[['#8e3aa0','#c47ad4'],['#6b2d8e','#a85fc0']],center:['#f5c542','#d9940d'],ink:'#4a1f5c'},
  {id:'lotus',em:'🪷',en:'Lotus',zh:'蓮花',petals:[14,20],layers:2,shape:'broad',cols:[['#d97a95','#f7c8d4'],['#e8e8e8','#f7f7f7']],center:['#f5c542','#eab308'],ink:'#7a4a55'},
  {id:'lavender',em:'💜',en:'Lavender',zh:'薰衣草',petals:[0,0],layers:0,shape:'lavender',cols:[['#8a6fd0','#b9a3e8'],['#7b5fc4','#a88fe0']],center:['#5c4a9b','#3d3270'],ink:'#4a3d7a'},
  {id:'tulip',em:'🌷',en:'Tulip',zh:'鬱金香',petals:[6,6],layers:1,shape:'cup',cols:[['#d94f5c','#f08a92'],['#eab308','#f5d547']],center:['#8e2f45','#5c1f2e'],ink:'#6b2230'},
  {id:'daisy',em:'🌼',en:'Wild Daisy',zh:'野雛菊',petals:[16,24],layers:2,shape:'narrow',cols:[['#f0f0e8','#ffffff']],center:['#eab308','#c47f0a'],ink:'#8a7a4a'},
];
const STEM_GREENS=['#2d6a4f','#3f8f5f','#6ba368'];
const GROW_SPEEDS=[0.006,0.012,0.022];
let curSpecies='any', curBg=2, toneMode='color';
const MONO_COLORS=['#c73e2e','#3e5fa8','#3e8e5a','#7b5fc4','#b07a3e','#c44a6e','#2b2b2b'];
let monoIdx=0;
function buildTones(){
  const el=document.getElementById('tones');
  const modes=['color','mono','bw'];
  el.innerHTML=t('tones').map((n,i)=>{
    const dot=i===1?`<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${MONO_COLORS[monoIdx]};margin-right:6px;vertical-align:baseline"></span>`:'';
    return `<button class="chip${toneMode===modes[i]?' on':''}" data-m="${modes[i]}">${dot}${n}</button>`;
  }).join('');
  el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
    const m=b.dataset.m;
    if(m==='mono'&&toneMode==='mono') monoIdx=(monoIdx+1)%MONO_COLORS.length; // each click cycles color
    else toneMode=m;
    if(m==='mono') toneMode='mono';
    buildTones();
  });
}
/* ---- tone: map any color to current tone mode ---- */
function parseCol(c){
  if(c[0]==='#'){const n=parseInt(c.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255];}
  const m=c.match(/[\d.]+/g);return [+m[0],+m[1],+m[2]];
}
function TC(c,f){
  if(toneMode==='color'||!c) return c;
  const [r,g,b]=parseCol(c);
  if(toneMode==='bw'){
    const lum=Math.round(0.299*r+0.587*g+0.114*b);
    const v=Math.round(45+lum*0.72);
    return `rgb(${v},${v},${v})`;
  }
  // mono: pull every color toward the selected mono hue
  const [br,bg,bb]=parseCol(MONO_COLORS[monoIdx]);
  return `rgb(${Math.round(r*0.22+br*0.78)},${Math.round(g*0.22+bg*0.78)},${Math.round(b*0.22+bb*0.78)})`;
}
/* sliders */
const SL={
  speed:()=>+document.getElementById('sSpeed').value/100,
  thick:()=>+document.getElementById('sThick').value/100,
  curve:()=>+document.getElementById('sCurve').value,
  len:()=>+document.getElementById('sLen').value/100,
  fcount:()=>+document.getElementById('sCount').value,
  size:()=>+document.getElementById('sSize').value/100,
};
function refreshVals(){
  document.getElementById('vSpeed').textContent=Math.round(SL.speed()*100)+'%';
  document.getElementById('vThick').textContent=Math.round(SL.thick()*100)+'%';
  document.getElementById('vCurve').textContent=Math.round(SL.curve())+'°';
  document.getElementById('vLen').textContent=Math.round(SL.len()*100)+'%';
  document.getElementById('vCount').textContent=SL.fcount();
  document.getElementById('vSize').textContent=Math.round(SL.size()*100)+'%';
}
['sSpeed','sThick','sCurve','sLen','sCount','sSize'].forEach(id=>
  document.getElementById(id).addEventListener('input',refreshVals));
function buildSpecies(){
  const el=document.getElementById('species');
  const all={id:'any',em:'🎲',en:lang==='zh'?'隨機':'Random',zh:'隨機'};
  el.innerHTML=[all,...SPECIES].map(s=>
    `<button class="chip${curSpecies===s.id?' on':''}" data-s="${s.id}"><span class="em">${s.em}</span>${lang==='zh'?(s.zh||s.en):s.en}</button>`
  ).join('');
  el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{curSpecies=b.dataset.s;buildSpecies();});
}
function buildBgs(){
  const el=document.getElementById('bgs');
  el.innerHTML=t('bgs').map((n,i)=>
    `<button class="chip${curBg===i?' on':''}" data-b="${i}">${n}</button>`
  ).join('');
  el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{curBg=+b.dataset.b;buildBgs();});
}

/* ================= flower forms (from reference images) ================= */
const FORM_IDS=['radial','cup','pom','spike'];
let curForm='radial';
function buildForms(){
  const el=document.getElementById('forms');
  el.innerHTML=t('forms').map((s,i)=>
    `<button class="chip${curForm===FORM_IDS[i]?' on':''}" data-fo="${FORM_IDS[i]}">${s.n}</button>`
  ).join('');
  el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{curForm=b.dataset.fo;buildForms();});
}
/* ================= art styles (from reference images) ================= */
const ART_IDS=['watercolor','flat','pop','riso','blur','line'];
let curStyle='watercolor';
function buildStyles(){
  const el=document.getElementById('styles');
  el.innerHTML=t('styles').map((s,i)=>
    `<button class="chip${curStyle===ART_IDS[i]?' on':''}" data-st="${ART_IDS[i]}">${s.n}</button>`
  ).join('');
  el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{curStyle=b.dataset.st;buildStyles();});
}
/* ================= vases (from reference images) ================= */
/* profile: [vFrac(0=base,1=top), halfWidthFrac] */
const VASES=[
  {id:'none'},
  {id:'blue',   color:'#2b5fa8', ink:'#1e3f70', mouth:0.18, profile:[[0,0.16],[0.12,0.28],[0.35,0.34],[0.55,0.28],[0.70,0.15],[0.82,0.13],[0.94,0.17],[1,0.18]]},
  {id:'mustard',color:'#d9a02b', ink:'#8a6414', mouth:0.20, sharp:true, profile:[[0,0.30],[0.2,0.18],[0.4,0.30],[0.6,0.18],[0.8,0.30],[1,0.20]]},
  {id:'orange', color:'#d94f2b', ink:'#8e2f16', mouth:0.20, profile:[[0,0.22],[0.25,0.36],[0.55,0.34],[0.75,0.20],[0.90,0.16],[1,0.20]]},
  {id:'green',  color:'#1e4d3a', ink:'#0f2c20', mouth:0.13, profile:[[0,0.20],[0.5,0.22],[0.65,0.20],[0.8,0.10],[0.95,0.10],[1,0.13]]},
  {id:'jug',    color:'#e8a0b0', ink:'#a05a6a', mouth:0.15, handle:true, profile:[[0,0.24],[0.3,0.34],[0.6,0.30],[0.8,0.16],[1,0.15]]},
  {id:'wavy',   color:'#e8823a', ink:'#a05218', mouth:0.22, profile:[[0,0.24],[0.15,0.30],[0.3,0.24],[0.45,0.30],[0.6,0.24],[0.75,0.28],[0.9,0.20],[1,0.22]]},
  {id:'bubble', color:'#7fd4c1', ink:'#3d8a76', mouth:0.20, bubbles:true},
  {id:'ribbed', color:'#aeb9c2', ink:'#6a757e', mouth:0.24, ribs:true, profile:[[0,0.24],[1,0.24]]},
  {id:'pink',   color:'#f2a0c0', ink:'#b0526e', mouth:0.14, profile:[[0,0.14],[0.2,0.30],[0.5,0.34],[0.7,0.28],[0.85,0.14],[1,0.14]]},
];
let curVase='none';
function buildVases(){
  const el=document.getElementById('vases');
  el.innerHTML=t('vases').map((s,i)=>
    `<button class="chip${curVase===VASES[i].id?' on':''}" data-v="${VASES[i].id}">${s.n}</button>`
  ).join('');
  el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{curVase=b.dataset.v;buildVases();});
}
function vaseDef(id){return VASES.find(v=>v.id===id);}
function vaseMetrics(f){
  const v=vaseDef(f.vase);
  if(!v||v.id==='none') return null;
  const S=f.scale, w=110*S, h=150*S, by=groundY();
  return {x:f.x, baseY:by, w, h, mouthX:f.x, mouthY:by-h+h*0.03, mouthHW:v.mouth*w, v};
}

function togglePanel(open){

/* ================= seeded random ================= */
function mulberry(seed){
  let a=seed>>>0;
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
function shadeCol(hex,amt){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  if(amt>=0){r+=(255-r)*amt;g+=(255-g)*amt;b+=(255-b)*amt;}
  else{r*=1+amt;g*=1+amt;b*=1+amt;}
  return `rgb(${r|0},${g|0},${b|0})`;
}
function mixCol(h1,h2,tt){
  const a=parseInt(h1.slice(1),16),b=parseInt(h2.slice(1),16);
  const r=(((a>>16)&255)*(1-tt)+((b>>16)&255)*tt)|0;
  const g=(((a>>8)&255)*(1-tt)+((b>>8)&255)*tt)|0;
  const bl=((a&255)*(1-tt)+(b&255)*tt)|0;
  return `rgb(${r},${g},${bl})`;
}

/* ================= canvas ================= */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let DPR=1,W=0,H=0,flowers=[],seeds=[],rain=[];
function sizeCanvas(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
}
function groundY(){ return H*0.93; }

/* ---- stipple ---- */
function stipple(g,cx,cy,r,dark,light,rng,ink){
  const n=Math.floor(r*r*0.06);
  for(let i=0;i<n;i++){
    const a=rng()*6.2832, d=Math.sqrt(rng())*r;
    const x=cx+Math.cos(a)*d, y=cy+Math.sin(a)*d;
    const shade=(y-cy)/r*0.5+0.5;
    const rr=rng();
    if(rr<shade*dark){
      g.fillStyle=ink; g.globalAlpha=0.28*rng()+0.12;
      g.beginPath();g.arc(x,y,0.7+rng()*1.3,0,6.2832);g.fill();
    }else if(rr>1-(1-shade)*light){
      g.fillStyle='#ffffff'; g.globalAlpha=0.35*rng()+0.15;
      g.beginPath();g.arc(x,y,0.6+rng()*1.1,0,6.2832);g.fill();
    }
  }
  g.globalAlpha=1;
}

/* ---- grain: risograph-style noise dots ---- */
function grain(g,cx,cy,r,rng,alpha){
  const n=Math.floor(r*r*0.055);
  g.fillStyle='#1c1c1e';
  for(let i=0;i<n;i++){
    const a=rng()*6.2832, d=Math.sqrt(rng())*r;
    g.globalAlpha=(alpha||1)*(0.08+rng()*0.14);
    g.beginPath();g.arc(cx+Math.cos(a)*d,cy+Math.sin(a)*d,0.6+rng()*1.3,0,6.2832);g.fill();
  }
  g.globalAlpha=1;
}
function mixWhite(c,amt){
  const [r,g,b]=parseCol(c);
  return `rgb(${Math.round(r+(255-r)*amt)|0},${Math.round(g+(255-g)*amt)|0},${Math.round(b+(255-b)*amt)|0})`;
}

/* ---- petal (6 art styles) ---- */
function petalPath(g,L,Wd,jit,rng){
  const j=()=>(rng()-0.5)*jit;
  g.beginPath();
  g.moveTo(0,0);
  g.bezierCurveTo(L*0.25+j(),-Wd*0.75+j(), L*0.75+j(),-Wd*0.85+j(), L,-Wd*0.1+j());
  g.bezierCurveTo(L*0.75+j(),Wd*0.85+j(), L*0.25+j(),Wd*0.75+j(), 0,0);
}
function petal(g,cx,cy,angle,len,wid,col,ink,rng,open,jit,f){
  const st=f&&f.style?f.style:'watercolor';
  g.save();g.translate(cx,cy);g.rotate(angle);
  const L=len*open, Wd=wid*len;
  const J=(st==='flat'||st==='pop'||st==='line')?0:jit; // clean shapes for graphic styles
  if(st==='blur'){
    g.save();g.filter='blur(7px)';
    g.globalAlpha=0.85;g.fillStyle=mixWhite(col[0],0.35);
    petalPath(g,L,Wd,J,rng);g.fill();
    g.globalAlpha=0.5;g.fillStyle=mixWhite(col[1],0.35);
    petalPath(g,L*0.92,Wd*0.9,J,rng);g.fill();
    g.restore();
  }else if(st==='flat'){
    g.fillStyle=col[0];
    petalPath(g,L,Wd,J,rng);g.fill();
  }else if(st==='pop'){
    g.fillStyle=col[0];
    petalPath(g,L,Wd,J,rng);g.fill();
    g.lineWidth=2.2;g.strokeStyle='#2b2b2b';g.globalAlpha=0.9;
    petalPath(g,L,Wd,J,rng);g.stroke();g.globalAlpha=1;
  }else if(st==='riso'){
    g.save();g.translate(2.5,-2);
    g.globalAlpha=0.32;g.fillStyle=ink;
    petalPath(g,L,Wd,J,rng);g.fill();g.restore();
    g.fillStyle=col[0];
    petalPath(g,L,Wd,J,rng);g.fill();
    const srng=mulberry((rng()*1e9)|0);
    g.save();petalPath(g,L,Wd,J,rng);g.clip();
    grain(g,L*0.5,0,L*0.6,srng,1);
    g.restore();
  }else if(st==='line'){
    g.lineWidth=1.3;g.strokeStyle=ink;g.globalAlpha=0.85;
    petalPath(g,L,Wd,J,rng);g.stroke();
    g.lineWidth=0.8;g.globalAlpha=0.45;
    g.beginPath();g.moveTo(L*0.12,0);g.lineTo(L*0.88,0);g.stroke();
    g.globalAlpha=1;
  }else{ // watercolor
    for(let layer=0;layer<2;layer++){
      g.globalAlpha=0.55-layer*0.15;
      g.fillStyle=layer?col[1]:col[0];
      petalPath(g,L,Wd,J,rng);g.fill();
    }
    g.globalAlpha=1;
    g.strokeStyle=ink; g.globalAlpha=0.45; g.lineWidth=1.1;
    g.beginPath();
    g.moveTo(0,0);
    g.bezierCurveTo(L*0.3,-Wd*0.7, L*0.7,-Wd*0.8, L*0.96,-Wd*0.08);
    g.stroke();
    g.globalAlpha=1;
    const srng=mulberry((rng()*1e9)|0);
    g.save();
    petalPath(g,L,Wd,J,rng);g.clip();
    stipple(g,L*0.5,0,L*0.55,0.55,0.4,srng,ink);
    g.restore();
  }
  g.restore();
}

/* ---- spike form (generic lavender-style spike) ---- */
function drawSpike(g,f,cx,cy,S,ease,sp,col,time){
  const st=f&&f.style?f.style:'watercolor';
  const rng=mulberry(f.seed+7);
  const tink=TC(sp.ink,f);
  const spikeLen=150*S*ease;
  const nF=26;
  // floret positions (shared)
  const fl=[];
  for(let i=0;i<nF;i++){
    const tt=i/(nF-1);
    fl.push({tt,
      fx:cx+Math.sin(tt*9+f.seed)*4*S+(rng()-0.5)*6*S,
      fy:cy-spikeLen*tt,
      fr:(4+rng()*6)*S*(0.7+tt*0.5),
      rot:(rng()-0.5)*0.8,
      c:TC(mixCol(col[0],col[1],rng()),f)});
  }
  if(st==='blur'){
    g.save();g.filter='blur(6px)';
    for(const p of fl){
      g.globalAlpha=0.8;g.fillStyle=mixWhite(p.c,0.35);
      g.beginPath();g.ellipse(p.fx,p.fy,p.fr*0.75,p.fr,p.rot,0,6.2832);g.fill();
    }
    g.restore();
  }else if(st==='flat'){
    for(const p of fl){
      g.globalAlpha=0.95;g.fillStyle=p.c;
      g.beginPath();g.ellipse(p.fx,p.fy,p.fr*0.75,p.fr,p.rot,0,6.2832);g.fill();
    }
    g.globalAlpha=1;
  }else if(st==='pop'){
    for(const p of fl){
      g.fillStyle=p.c;
      g.beginPath();g.ellipse(p.fx,p.fy,p.fr*0.75,p.fr,p.rot,0,6.2832);g.fill();
      g.lineWidth=1.8;g.strokeStyle='#2b2b2b';g.globalAlpha=0.9;
      g.beginPath();g.ellipse(p.fx,p.fy,p.fr*0.75,p.fr,p.rot,0,6.2832);g.stroke();g.globalAlpha=1;
    }
  }else if(st==='riso'){
    for(const p of fl){
      g.save();g.translate(2,-1.5);
      g.globalAlpha=0.3;g.fillStyle=tink;
      g.beginPath();g.ellipse(p.fx,p.fy,p.fr*0.75,p.fr,p.rot,0,6.2832);g.fill();g.restore();
      g.globalAlpha=0.95;g.fillStyle=p.c;
      g.beginPath();g.ellipse(p.fx,p.fy,p.fr*0.75,p.fr,p.rot,0,6.2832);g.fill();
      g.globalAlpha=1;
      const srng=mulberry((f.seed+p.tt*999)|0);
      g.save();
      g.beginPath();g.ellipse(p.fx,p.fy,p.fr*0.75,p.fr,0,0,6.2832);g.clip();
      grain(g,p.fx,p.fy,p.fr,srng,1);
      g.restore();
    }
  }else if(st==='line'){
    g.lineWidth=1.2;g.strokeStyle=tink;g.globalAlpha=0.85;
    for(const p of fl){
      g.beginPath();g.ellipse(p.fx,p.fy,p.fr*0.7,p.fr*0.9,p.rot,0,6.2832);g.stroke();
    }
    g.globalAlpha=1;
  }else{ // watercolor
    for(let i=0;i<nF;i++){
      const p=fl[i];
      g.globalAlpha=0.55+rng()*0.25;
      g.fillStyle=p.c;
      g.beginPath();
      g.ellipse(p.fx,p.fy,p.fr*0.75,p.fr,p.rot,0,6.2832);
      g.fill();
      g.globalAlpha=0.4;
      g.fillStyle=TC(col[1],f);
      g.beginPath();
      g.ellipse(p.fx-p.fr*0.2,p.fy-p.fr*0.25,p.fr*0.4,p.fr*0.45,0,0,6.2832);
      g.fill();
      g.globalAlpha=1;
      const srng=mulberry((f.seed+i*13)|0);
      g.save();
      g.beginPath();g.ellipse(p.fx,p.fy,p.fr*0.75,p.fr,0,0,6.2832);g.clip();
      stipple(g,p.fx,p.fy,p.fr,0.5,0.3,srng,tink);
      g.restore();
      if(rng()<0.4){
        g.globalAlpha=0.5;g.fillStyle=tink;
        g.beginPath();g.arc(p.fx+(rng()-0.5)*p.fr,p.fy+(rng()-0.5)*p.fr,1.1,0,6.2832);g.fill();
        g.globalAlpha=1;
      }
    }
  }
  // thin stem through spike
  const stemC=TC(f.stemGreen,f);
  g.globalAlpha=0.7;g.strokeStyle=st==='line'?tink:stemC;
  g.lineWidth=st==='line'?1.2:Math.max(1,2*S);
  g.beginPath();g.moveTo(cx,cy);g.lineTo(cx,cy-spikeLen*1.02);g.stroke();
  g.globalAlpha=1;
}

/* ---- cup form: tulip-like cup viewed from the side ---- */
function drawCup(g,f,cx,cy,S,ease,sp,col,time){
  const st=f.style||'watercolor';
  const tink=TC(sp.ink,f);
  const c0=TC(col[0],f), c1=TC(col[1],f);
  const R=58*S*ease, Wd=R*0.82;
  const rng=mulberry(f.seed+55);
  const bodyPath=()=>{
    g.beginPath();
    g.moveTo(cx-Wd, cy-R*0.98);
    g.bezierCurveTo(cx-Wd*1.06, cy-R*0.55, cx-Wd*0.72, cy-R*0.12, cx, cy);
    g.bezierCurveTo(cx+Wd*0.72, cy-R*0.12, cx+Wd*1.06, cy-R*0.55, cx+Wd, cy-R*0.98);
    g.closePath();
  };
  const blurred=st==='blur';
  if(blurred){ g.save(); g.filter='blur(5px)'; }
  if(st==='line'){
    bodyPath(); g.lineWidth=1.4; g.strokeStyle=tink; g.globalAlpha=0.9; g.stroke(); g.globalAlpha=1;
  }else{
    if(st==='riso'){ g.save(); g.translate(2.5,-2); bodyPath(); g.globalAlpha=0.3; g.fillStyle=tink; g.fill(); g.restore(); }
    bodyPath();
    g.fillStyle=blurred?mixWhite(c0,0.3):c0;
    g.fill();
    if(st==='watercolor'){
      g.save(); bodyPath(); g.clip();
      g.globalAlpha=0.4; g.fillStyle=mixWhite(c1,0.3);
      g.fillRect(cx-Wd,cy-R,Wd*2,R); g.globalAlpha=1;
      stipple(g,cx,cy-R*0.5,Wd*0.8,0.5,0.25,mulberry((f.seed+56)|0),tink);
      g.restore();
      bodyPath(); g.lineWidth=1.2; g.strokeStyle=tink; g.globalAlpha=0.5; g.stroke(); g.globalAlpha=1;
    }
    if(st==='pop'){ bodyPath(); g.lineWidth=2.4; g.strokeStyle='#2b2b2b'; g.stroke(); }
    if(st==='riso'){
      g.save(); bodyPath(); g.clip();
      grain(g,cx,cy-R*0.5,Wd*0.8,mulberry((f.seed+56)|0),1);
      g.restore();
    }
  }
  if(blurred) g.restore();
  // petal seams
  if(st==='watercolor'||st==='line'){
    g.strokeStyle=tink; g.globalAlpha=st==='line'?0.7:0.35; g.lineWidth=1.1;
    for(const off of [-0.45,0,0.45]){
      g.beginPath();
      g.moveTo(cx+off*Wd, cy-R*0.95);
      g.quadraticCurveTo(cx+off*Wd*1.15, cy-R*0.5, cx+off*Wd*0.5, cy-R*0.06);
      g.stroke();
    }
    g.globalAlpha=1;
  }
  // petal tips above the rim
  const nTip=5;
  for(let i=0;i<nTip;i++){
    const t=i/(nTip-1);
    const tx=cx+(t-0.5)*Wd*1.7;
    const th=R*(0.26+0.12*Math.sin(t*Math.PI+1));
    const tcol=TC(mixCol(col[0],col[1],rng()),f);
    if(st==='line'){
      g.strokeStyle=tink; g.lineWidth=1.2; g.globalAlpha=0.85;
      g.beginPath(); g.moveTo(tx-Wd*0.14,cy-R*0.95);
      g.quadraticCurveTo(tx,cy-R*0.95-th, tx+Wd*0.14,cy-R*0.95); g.stroke(); g.globalAlpha=1;
    }else{
      const tipBlur=st==='blur';
      if(tipBlur){ g.save(); g.filter='blur(4px)'; }
      g.fillStyle=tipBlur?mixWhite(tcol,0.3):tcol;
      g.beginPath(); g.moveTo(tx-Wd*0.16,cy-R*0.92);
      g.quadraticCurveTo(tx,cy-R*0.92-th*1.15, tx+Wd*0.16,cy-R*0.92);
      g.quadraticCurveTo(tx,cy-R*0.88, tx-Wd*0.16,cy-R*0.92);
      g.fill();
      if(tipBlur) g.restore(); else if(st==='pop'){ g.lineWidth=1.8; g.strokeStyle='#2b2b2b'; g.stroke(); }
    }
  }
}

/* ---- pom form: spherical pom-pom / allium cluster ---- */
function drawPom(g,f,cx,cy,S,ease,sp,col,time){
  const st=f.style||'watercolor';
  const tink=TC(sp.ink,f);
  const R=44*S*ease;
  const cyy=cy-R*0.55; // sit atop the stem
  const rng=mulberry(f.seed+77);
  const fl=[];
  const n=46;
  for(let i=0;i<n;i++){
    const a=rng()*6.2832, d=Math.sqrt(rng());
    fl.push({
      x:Math.cos(a)*d*R, y:Math.sin(a)*d*R*0.92,
      r:(2.2+rng()*3.4)*S*(1-d*0.3),
      c:TC(mixCol(col[0],col[1],rng()),f)
    });
  }
  fl.sort((a,b)=>a.y-b.y);
  const blurred=st==='blur';
  if(blurred){ g.save(); g.filter='blur(4px)'; }
  for(const p of fl){
    const px=cx+p.x, py=cyy+p.y;
    if(st==='line'){
      g.lineWidth=1; g.strokeStyle=tink; g.globalAlpha=0.7;
      g.beginPath(); g.arc(px,py,Math.max(0.8,p.r*0.8),0,6.2832); g.stroke(); g.globalAlpha=1;
    }else{
      if(st==='riso'){
        g.globalAlpha=0.3; g.fillStyle=tink;
        g.beginPath(); g.arc(px+1.5,py-1,p.r,0,6.2832); g.fill();
      }
      g.globalAlpha=st==='watercolor'?0.8:0.95;
      g.fillStyle=blurred?mixWhite(p.c,0.3):p.c;
      g.beginPath(); g.arc(px,py,p.r,0,6.2832); g.fill();
      g.globalAlpha=1;
      if(st==='pop'){
        g.lineWidth=1.4; g.strokeStyle='#2b2b2b';
        g.beginPath(); g.arc(px,py,p.r,0,6.2832); g.stroke();
      }
    }
  }
  if(blurred) g.restore();
  if(st==='watercolor'){
    g.save(); g.beginPath(); g.arc(cx,cyy,R,0,6.2832); g.clip();
    stipple(g,cx,cyy,R,0.45,0.2,mulberry((f.seed+78)|0),tink);
    g.restore();
  }
  if(st==='riso'){
    g.save(); g.beginPath(); g.arc(cx,cyy,R,0,6.2832); g.clip();
    grain(g,cx,cyy,R,mulberry((f.seed+78)|0),1);
    g.restore();
  }
}

/* ---- flower head ---- */
function drawHead(g,f,cx,cy,S,ease,sp,col,time,szMul){
  const form=f.form||'radial';
  if(form==='spike'){ drawSpike(g,f,cx,cy,S*szMul,ease,sp,col,time); return; }
  if(form==='cup'){ drawCup(g,f,cx,cy,S*szMul,ease,sp,col,time); return; }
  if(form==='pom'){ drawPom(g,f,cx,cy,S*szMul,ease,sp,col,time); return; }
  const R=52*S*szMul*ease;
  const tcol=[TC(col[0],f),TC(col[1],f)], tink=TC(sp.ink,f);
  const rng0=mulberry(f.seed);
  const layers=sp.layers||1;
  for(let li=layers-1;li>=0;li--){
    const lr=1-li*0.28;
    const n=Math.max(3,Math.round(f.petals.length/layers));
    for(let i=0;i<n;i++){
      const p=f.petals[(li*n+i)%f.petals.length];
      const open=ease*(li===0?1:0.72);
      const prng=mulberry((f.seed+i*77+li*31)|0);
      petal(g,cx,cy,p.a+(li*0.35),R*p.len*lr,p.wid,tcol,tink,prng,open,3,f);
    }
  }
  const cr=R*0.30*ease;
  if(cr>1){
    const st=f&&f.style?f.style:'watercolor';
    const c0=TC(sp.center[0],f), c1=TC(sp.center[1],f);
    if(st==='blur'){
      g.save();g.filter='blur(4px)';
      g.globalAlpha=0.9;g.fillStyle=mixWhite(c0,0.3);
      g.beginPath();g.arc(cx,cy,cr,0,6.2832);g.fill();
      g.restore();
    }else if(st==='flat'){
      g.fillStyle=c0;
      g.beginPath();g.arc(cx,cy,cr,0,6.2832);g.fill();
    }else if(st==='pop'){
      g.fillStyle=c0;
      g.beginPath();g.arc(cx,cy,cr,0,6.2832);g.fill();
      g.lineWidth=2.2;g.strokeStyle='#2b2b2b';
      g.beginPath();g.arc(cx,cy,cr,0,6.2832);g.stroke();
      // dotted ring (ref 1 style)
      g.fillStyle='#fff';
      for(let i=0;i<10;i++){
        const a=(i/10)*6.2832;
        g.beginPath();g.arc(cx+Math.cos(a)*cr*0.55,cy+Math.sin(a)*cr*0.55,Math.max(1,cr*0.09),0,6.2832);g.fill();
      }
    }else if(st==='riso'){
      g.save();g.translate(2,-1.5);
      g.globalAlpha=0.32;g.fillStyle=tink;
      g.beginPath();g.arc(cx,cy,cr,0,6.2832);g.fill();g.restore();
      g.fillStyle=c0;
      g.beginPath();g.arc(cx,cy,cr,0,6.2832);g.fill();
      const crng=mulberry((f.seed+999)|0);
      g.save();g.beginPath();g.arc(cx,cy,cr,0,6.2832);g.clip();
      grain(g,cx,cy,cr,crng,1);
      g.restore();
    }else if(st==='line'){
      g.lineWidth=1.2;g.strokeStyle=tink;g.globalAlpha=0.85;
      g.beginPath();g.arc(cx,cy,cr,0,6.2832);g.stroke();
      g.globalAlpha=1;
      g.fillStyle=tink;
      g.beginPath();g.arc(cx,cy,Math.max(1,cr*0.18),0,6.2832);g.fill();
    }else{ // watercolor
      g.globalAlpha=0.85;g.fillStyle=c0;
      g.beginPath();g.arc(cx,cy,cr,0,6.2832);g.fill();
      g.globalAlpha=1;
      const crng=mulberry((f.seed+999)|0);
      g.save();g.beginPath();g.arc(cx,cy,cr,0,6.2832);g.clip();
      stipple(g,cx,cy,cr,0.5,0.2,crng,tink);
      g.restore();
      g.strokeStyle=tink;g.globalAlpha=0.5;g.lineWidth=Math.max(1,1.4*S);
      const nSt=8;
      for(let i=0;i<nSt;i++){
        const a=(i/nSt)*6.2832+f.seed;
        g.beginPath();g.moveTo(cx+Math.cos(a)*cr*0.4,cy+Math.sin(a)*cr*0.4);
        g.lineTo(cx+Math.cos(a)*cr*1.5,cy+Math.sin(a)*cr*1.5);g.stroke();
        g.globalAlpha=0.9;g.fillStyle=c1;
        g.beginPath();g.arc(cx+Math.cos(a)*cr*1.5,cy+Math.sin(a)*cr*1.5,Math.max(1,2.4*S),0,6.2832);g.fill();
        g.globalAlpha=0.5;
      }
      g.globalAlpha=1;
    }
  }
}

/* ---- flower head, rotated to align with stem tip tangent ---- */
function drawHeadAt(g,f,tx,ty,tipAngle,S,ease,sp,col,time,szMul){
  g.save(); g.translate(tx,ty); g.rotate(tipAngle);
  drawHead(g,f,0,0,S,ease,sp,col,time,szMul);
  g.restore();
}

/* ---- leaf (6 art styles) ---- */
function leafPath(g,ls){
  g.beginPath();
  g.moveTo(0,0);
  g.bezierCurveTo(ls*0.4,-ls*0.35, ls*0.9,-ls*0.25, ls,0);
  g.bezierCurveTo(ls*0.9,ls*0.25, ls*0.4,ls*0.35, 0,0);
}
function drawLeaf(g,lx,ly,rot,ls,c,ink,st,f,l){
  g.save();g.translate(lx,ly);g.rotate(rot);
  if(st==='flat'){
    g.fillStyle=c;leafPath(g,ls);g.fill();
  }else if(st==='pop'){
    g.fillStyle=c;leafPath(g,ls);g.fill();
    g.lineWidth=2;g.strokeStyle='#22301f';leafPath(g,ls);g.stroke();
  }else if(st==='riso'){
    g.fillStyle=c;leafPath(g,ls);g.fill();
    const lrng=mulberry((f.seed+l.size*99)|0);
    g.save();leafPath(g,ls);g.clip();
    grain(g,ls*0.5,0,ls*0.55,lrng,1);
    g.restore();
  }else if(st==='blur'){
    g.save();g.filter='blur(3px)';
    g.globalAlpha=0.85;g.fillStyle=mixWhite(c,0.3);leafPath(g,ls);g.fill();
    g.restore();
  }else if(st==='line'){
    g.lineWidth=1.2;g.strokeStyle=ink;g.globalAlpha=0.85;
    leafPath(g,ls);g.stroke();g.globalAlpha=1;
  }else{ // watercolor
    g.globalAlpha=0.7; g.fillStyle=c;leafPath(g,ls);g.fill();
    g.globalAlpha=0.4; g.strokeStyle=ink; g.lineWidth=1;
    g.beginPath();g.moveTo(2,0);g.lineTo(ls*0.85,0);g.stroke();
    g.globalAlpha=1;
    const lrng=mulberry((f.seed+l.size*99)|0);
    g.save();leafPath(g,ls);g.clip();
    stipple(g,ls*0.5,0,ls*0.5,0.4,0.25,lrng,ink);
    g.restore();
  }
  g.restore();
}

/* ---- vase silhouettes ---- */
function vaseSilhouette(g,cx,by,w,h,v){
  if(v.bubbles){
    // stacked bubbles
    const r1=w*0.30,r2=w*0.24,r3=w*0.18;
    g.beginPath();
    g.arc(cx,by-r1,r1,0,6.2832);
    g.arc(cx,by-r1*2-r2*0.7,r2,0,6.2832);
    g.arc(cx,by-r1*2-r2*1.4-r3*0.6,r3,0,6.2832);
    return;
  }
  const P=v.profile;
  const L=P.map(([vf,hwf])=>[cx-hwf*w, by-vf*h]);
  g.beginPath();
  g.moveTo(L[0][0],L[0][1]);
  for(let i=1;i<L.length;i++){
    const [x1,y1]=L[i-1],[x2,y2]=L[i];
    if(v.sharp){ g.lineTo(x2,y2); }
    else{ const mx=(x1+x2)/2; g.bezierCurveTo(mx,y1,mx,y2,x2,y2); }
  }
  const topHW=P[P.length-1][1]*w;
  g.lineTo(cx+topHW,by-h);
  for(let i=L.length-1;i>=1;i--){
    const x1=2*cx-L[i][0],y1=L[i][1],x2=2*cx-L[i-1][0],y2=L[i-1][1];
    if(v.sharp){ g.lineTo(x2,y2); }
    else{ const mx=(x1+x2)/2; g.bezierCurveTo(mx,y1,mx,y2,x2,y2); }
  }
  g.closePath();
}
/* ---- vase (style follows flower art style) ---- */
function drawVase(g,f,vm){
  const v=vm.v, st=f.style||'watercolor';
  const vg=f.vaseGrow===undefined?1:f.vaseGrow;
  if(vg<=0) return;
  const col=TC(v.color,f), ink=TC(v.ink||'#3a3a3a',f);
  const cx=vm.x, by=vm.baseY, w=vm.w, h=vm.h;
  g.save();
  g.translate(cx,by);g.scale(Math.max(0.01,vg),Math.max(0.01,vg));g.translate(-cx,-by);
  if(st==='blur') g.filter='blur(5px)';
  // body
  vaseSilhouette(g,cx,by,w,h,v);
  if(st==='line'){
    g.lineWidth=1.6;g.strokeStyle=ink;g.globalAlpha=0.9;g.stroke();g.globalAlpha=1;
  }else{
    if(st==='riso'){ // misregistration underlay
      g.save();g.translate(3,-2);
      vaseSilhouette(g,cx,by,w,h,v);
      g.globalAlpha=0.3;g.fillStyle=ink;g.fill();g.restore();
    }
    g.fillStyle=st==='blur'?mixWhite(col,0.25):col;
    vaseSilhouette(g,cx,by,w,h,v);g.fill();
    if(st==='watercolor'){
      vaseSilhouette(g,cx,by,w,h,v);
      g.globalAlpha=0.45;g.fillStyle=mixWhite(col,0.4);g.fill();
      g.save();g.clip();
      const srng=mulberry((f.seed+31)|0);
      stipple(g,cx,by-h*0.35,w*0.4,0.5,0.25,srng,ink);
      g.restore();g.globalAlpha=1;
    }
    if(st==='riso'){
      g.save();vaseSilhouette(g,cx,by,w,h,v);g.clip();
      const srng=mulberry((f.seed+31)|0);
      grain(g,cx,by-h*0.45,w*0.42,srng,1);
      g.restore();
    }
    if(st==='pop'){
      g.lineWidth=3;g.strokeStyle='#2b2b2b';
      vaseSilhouette(g,cx,by,w,h,v);g.stroke();
    }else if(st==='watercolor'){
      g.lineWidth=1.4;g.strokeStyle=ink;g.globalAlpha=0.6;
      vaseSilhouette(g,cx,by,w,h,v);g.stroke();g.globalAlpha=1;
    }
  }
  // extras: handle / ribs
  if(v.handle&&st!=='blur'){
    g.lineWidth=st==='line'?1.6:7;g.strokeStyle=st==='line'?ink:col;
    g.globalAlpha=st==='line'?0.9:1;
    g.beginPath();
    g.arc(cx+w*0.34,by-h*0.55,w*0.16, -1.2, 1.2);
    g.stroke();g.globalAlpha=1;
  }
  if(v.ribs&&st!=='line'){
    g.strokeStyle=st==='flat'||st==='pop'?'rgba(255,255,255,.55)':'rgba(255,255,255,.4)';
    g.lineWidth=Math.max(1,w*0.012);
    for(let i=-3;i<=3;i++){
      g.beginPath();
      g.moveTo(cx+i*w*0.06,by-h*0.96);
      g.lineTo(cx+i*w*0.055,by-h*0.04);
      g.stroke();
    }
  }
  if(st==='blur') g.filter='none';
  g.restore();
}

function drawFlower(g,f,time){
  const sp=SPECIES.find(s=>s.id===f.sp);
  const S=f.scale, gy=groundY();
  const st=f.style||'watercolor';
  const vm=vaseMetrics(f);
  // vase first (behind stem)
  if(vm) drawVase(g,f,vm);
  const vg=f.vaseGrow===undefined?1:f.vaseGrow;
  const sway=Math.sin(time*0.001+f.swayPh)*4*S;
  // with a vase: base locked to the (animated) vase mouth, no ambient sway
  const bx=f.x+(vm?0:sway), by=vm?(vm.baseY-vm.h*vg*0.97):gy;
  const arcLen=f.stemLen*H*0.52*f.grow;
  // bend: 90° = straight up, 180° = tip horizontal; bends progressively as it grows
  const phiT=(f.curve-90)*Math.PI/180;
  const phi=phiT*Math.min(1,f.grow*1.15);
  const dir=f.bendDir;
  const arcPt=t=>{
    let px,py;
    if(phi<0.001){ px=bx; py=by-arcLen*t; }
    else{
      px=bx+dir*arcLen*(1-Math.cos(phi*t))/phi;
      py=by-arcLen*Math.sin(phi*t)/phi;
    }
    return [px+f.swayX*t, py]; // sway grows toward tip, base stays planted
  };
  const [stemTopX,stemTopY]=arcPt(1);
  f.headX=stemTopX; f.headY=stemTopY;
  const tipAngle=dir*phi; // rotate head to tip tangent
  const rng=mulberry(f.seed);
  const thick=Math.max(1,6*S*f.grow*f.thick);
  const stemC=TC(f.stemGreen,f), stemC2=TC(shadeCol(f.stemGreen,0.2),f);
  const tink=TC(sp.ink,f);
  // stem: smooth arc, per style
  g.lineCap='round';
  const traceStem=(dx,w,color,alpha,blurPx)=>{
    if(blurPx){g.save();g.filter=`blur(${blurPx}px)`;}
    g.globalAlpha=alpha;g.strokeStyle=color;g.lineWidth=Math.max(0.8,w);
    g.beginPath();
    const N=24;
    for(let k=0;k<=N;k++){
      const [px,py]=arcPt(k/N);
      if(k===0) g.moveTo(px+dx,py); else g.lineTo(px+dx,py);
    }
    g.stroke();g.globalAlpha=1;
    if(blurPx)g.restore();
  };
  if(st==='flat'){ traceStem(0,thick,stemC,1); }
  else if(st==='pop'){ traceStem(0,thick+3.5,'#22301f',1); traceStem(0,thick,stemC,1); }
  else if(st==='riso'){ traceStem(2.5,thick,'rgba(35,35,45,.35)',1); traceStem(0,thick,stemC,1); }
  else if(st==='blur'){ traceStem(0,thick,stemC,0.9,2.5); }
  else if(st==='line'){ traceStem(0,Math.max(1.2,thick*0.35),tink,0.9); }
  else{ traceStem(1.5,thick,stemC,0.75); traceStem(0,Math.max(1,thick-2*S*f.thick),stemC2,0.5); } // watercolor
  // leaves
  for(const l of f.leaves){
    if(f.grow<l.t) continue;
    const lt=Math.min(1,(f.grow-l.t)/(1-l.t)*2);
    const [lx,ly]=arcPt(l.t*0.85);
    const ls=l.size*46*S*lt;
    if(ls<2)continue;
    drawLeaf(g,lx,ly,l.side*(l.ang+0.4),ls,stemC,tink,st,f,l);
  }
  if(f.grow<0.55) return;
  const bloomP=Math.min(1,(f.grow-0.55)/0.45);
  const ease=1-Math.pow(1-bloomP,3);
  const col=sp.cols[f.seed%sp.cols.length];
  // main head (aligned to tip tangent)
  drawHeadAt(g,f,stemTopX,stemTopY,tipAngle,S,ease,sp,col,time,1);
  // branch flowers
  for(const br of f.branches){
    if(bloomP<br.t) continue;
    const be=1-Math.pow(1-Math.min(1,(bloomP-br.t)/(1-br.t)*1.6),3);
    const [sx,sy]=arcPt(br.st);
    const blen=70*S*br.len*be;
    const bang=br.side*(0.9+br.ang*0.5);
    const ex=sx+Math.sin(bang)*blen, ey=sy-Math.cos(bang)*blen*0.8;
    // branch stem
    g.globalAlpha=0.7;g.strokeStyle=st==='line'?tink:stemC;g.lineCap='round';
    g.lineWidth=st==='line'?1.2:Math.max(1,thick*0.55*be);
    g.beginPath();g.moveTo(sx,sy);
    g.quadraticCurveTo(sx+Math.sin(bang)*blen*0.5,sy-8,ex,ey);
    g.stroke();g.globalAlpha=1;
    // tip tangent of branch → head rotation
    const txv=ex-(sx+Math.sin(bang)*blen*0.5), tyv=ey-(sy-8);
    drawHeadAt(g,f,ex,ey,Math.atan2(txv,-tyv),S,be,sp,col,time,br.sz);
  }
}

/* ---- seed ---- */
function drawSeed(g,s){
  g.save();g.translate(s.x,s.y);g.rotate(s.rot);
  g.fillStyle=TC('#5c4a32',null);
  g.beginPath();g.ellipse(0,0,4.5,6.5,0,0,6.2832);g.fill();
  g.fillStyle=TC('#7a6248',null);
  g.beginPath();g.ellipse(-1,-1.5,2,3,0.3,0,6.2832);g.fill();
  g.restore();
}

/* ================= mouse trail + brush physics ================= */
let trail=[];
function spawnTrail(x,y){
  for(let i=0;i<2;i++){
    if(trail.length>160) trail.shift();
    trail.push({x:x+(Math.random()-0.5)*10, y:y+(Math.random()-0.5)*10,
      vx:(Math.random()-0.5)*36, vy:(Math.random()-0.5)*36-24,
      life:1, sz:1+Math.random()*2.4});
  }
}
let pMX=null,pMY=null,pMT=0;
function brushFlowers(x,y){
  const now=performance.now();
  if(pMX===null){pMX=x;pMY=y;pMT=now;return;}
  const dtm=Math.max(8,now-pMT)/1000;
  const vx=(x-pMX)/dtm, vy=(y-pMY)/dtm;
  pMX=x;pMY=y;pMT=now;
  spawnTrail(x,y);
  const sp=Math.hypot(vx,vy);
  if(sp<80) return;
  for(const f of flowers){
    const dx=x-f.headX, dy=y-f.headY;
    const d=Math.hypot(dx,dy);
    const R=110*f.scale+50;
    if(d<R){
      const fall=1-d/R;
      f.swayV+=vx*fall*0.055*Math.min(1,sp/1600);
      f.swayV=Math.max(-380,Math.min(380,f.swayV));
    }
  }
}
cv.addEventListener('mousemove',e=>brushFlowers(e.clientX,e.clientY));
cv.addEventListener('touchmove',e=>{
  const tc=e.touches[0];
  if(tc) brushFlowers(tc.clientX,tc.clientY);
},{passive:true});

/* ================= backgrounds ================= */
function drawBackground(g,time){
  const th=document.documentElement.dataset.theme;
  const dark=th==='black';
  if(curBg===3){ // watercolor paper
    g.fillStyle=dark?'#241f16':'#f5f1e6';g.fillRect(0,0,W,H);
    const rng=mulberry(7);
    for(let i=0;i<2500;i++){
      g.fillStyle=rng()<0.5?'rgba(120,100,70,.045)':'rgba(255,255,255,.05)';
      g.fillRect(rng()*W,rng()*H,1+rng()*2,1+rng()*2);
    }
    // soft vignette
    const vg=g.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.75);
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,dark?'rgba(0,0,0,.28)':'rgba(120,100,70,.16)');
    g.fillStyle=vg;g.fillRect(0,0,W,H);
  }else if(curBg===0){ // sunny
    g.fillStyle=dark?'#16202c':'#cfe8f5';g.fillRect(0,0,W,H);
    const sg=g.createRadialGradient(W*0.82,H*0.16,10,W*0.82,H*0.16,H*0.45);
    sg.addColorStop(0,'rgba(255,240,180,.9)');sg.addColorStop(1,'rgba(255,240,180,0)');
    g.fillStyle=sg;g.fillRect(0,0,W,H);
    g.fillStyle=dark?'#ffdf80':'#f5c542';
    g.beginPath();g.arc(W*0.82,H*0.16,34,0,6.2832);g.fill();
    g.fillStyle=dark?'rgba(255,255,255,.08)':'rgba(255,255,255,.75)';
    for(let i=0;i<3;i++){
      const cx=((time*0.008*(i+1))%(W+300))-150, cy=H*(0.12+i*0.09);
      g.beginPath();
      g.ellipse(cx,cy,70,22,0,0,6.2832);
      g.ellipse(cx+40,cy+6,50,18,0,0,6.2832);
      g.ellipse(cx-40,cy+6,50,18,0,0,6.2832);
      g.fill();
    }
  }else if(curBg===1){ // light green
    g.fillStyle=dark?'#14231a':'#e2f0da';g.fillRect(0,0,W,H);
  }else if(curBg===2){ // gray dots (light)
    g.fillStyle=dark?'#1e1e1e':'#f1f1f1';g.fillRect(0,0,W,H);
    g.fillStyle=dark?'rgba(255,255,255,.10)':'rgba(0,0,0,.08)';
    for(let y=14;y<H;y+=28)for(let x=14;x<W;x+=28){
      g.beginPath();g.arc(x,y,1.6,0,6.2832);g.fill();
    }
  }else if(curBg===7){ // black
    g.fillStyle='#101010';g.fillRect(0,0,W,H);
  }else if(curBg===8){ // white
    g.fillStyle='#fdfdfd';g.fillRect(0,0,W,H);
  }else if(curBg===4){ // concrete
    g.fillStyle=dark?'#232323':'#cfcfcb';g.fillRect(0,0,W,H);
    const rng=mulberry(42);
    for(let i=0;i<900;i++){
      g.fillStyle=rng()<0.5?'rgba(0,0,0,.05)':'rgba(255,255,255,.06)';
      g.fillRect(rng()*W,rng()*H,1+rng()*3,1+rng()*3);
    }
    g.strokeStyle='rgba(0,0,0,.08)';g.lineWidth=1;
    for(let i=0;i<4;i++){
      g.beginPath();
      let x=rng()*W,y=rng()*H*0.5;
      g.moveTo(x,y);
      for(let k=0;k<5;k++){x+=(rng()-0.5)*60;y+=rng()*40;g.lineTo(x,y);}
      g.stroke();
    }
  }else if(curBg===5){ // rainy
    g.fillStyle=dark?'#1a222c':'#b9c8d4';g.fillRect(0,0,W,H);
    g.strokeStyle=dark?'rgba(180,200,220,.35)':'rgba(90,110,130,.35)';
    g.lineWidth=1.2;
    for(const r of rain){
      g.beginPath();g.moveTo(r.x,r.y);g.lineTo(r.x-3,r.y+14);g.stroke();
    }
  }else if(curBg===6){ // cloudy
    g.fillStyle=dark?'#20242a':'#d4d8dc';g.fillRect(0,0,W,H);
    g.fillStyle=dark?'rgba(255,255,255,.06)':'rgba(255,255,255,.5)';
    for(let i=0;i<5;i++){
      const cx=W*(0.1+i*0.2), cy=H*(0.1+((i*37)%40)/100);
      g.beginPath();
      g.ellipse(cx,cy,90,26,0,0,6.2832);
      g.ellipse(cx+50,cy+8,60,20,0,0,6.2832);
      g.ellipse(cx-50,cy+8,60,20,0,0,6.2832);
      g.fill();
    }
  }
  g.fillStyle=dark?'rgba(0,0,0,.25)':'rgba(60,80,60,.14)';
  g.beginPath();g.ellipse(W/2,groundY()+H*0.05,W*0.72,H*0.075,0,0,6.2832);g.fill();
}

function render(time){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawBackground(ctx,time);
  const sorted=[...flowers].sort((a,b)=>a.scale-b.scale);
  for(const f of sorted){ try{ drawFlower(ctx,f,time); }catch(e){} }
  for(const s of seeds){ try{ drawSeed(ctx,s); }catch(e){} }
  // mouse trail particles
  for(const p of trail){
    ctx.globalAlpha=p.life*0.45;
    ctx.fillStyle='#8a8a8e';
    ctx.beginPath();ctx.arc(p.x,p.y,Math.max(0.4,p.sz*p.life),0,6.2832);ctx.fill();
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(render);
}

/* ================= flower generation ================= */
function genFlower(speciesId,x,scale,rng,opts,styleId,vaseId,formId){
  const sp=SPECIES.find(s=>s.id===speciesId)||SPECIES[(rng()*SPECIES.length)|0];
  const sd=(rng()*1e9)|0;
  const f={
    sp:sp.id, x, scale,
    seed:sd,
    style:styleId||'watercolor',
    vase:vaseId||'none',
    form:formId||'radial',
    locked:true, vaseGrow:0,
    stemLen:(0.75+rng()*0.4)*opts.len,
    stemGreen:STEM_GREENS[(rng()*3)|0],
    growSpeed:GROW_SPEEDS[(rng()*3)|0]*opts.speed,
    thick:opts.thick*(0.9+rng()*0.2),
    curve:opts.curve,
    bendDir:rng()<0.5?-1:1,
    petals:[],leaves:[],branches:[],
    grow:0, swayPh:rng()*6.28,
    swayX:0, swayV:0, headX:x, headY:groundY()-100,
    monoBase:sp.cols[sd%sp.cols.length][0],
  };
  const nP=sp.petals[0]+((rng()*(sp.petals[1]-sp.petals[0]+1))|0);
  for(let i=0;i<nP;i++) f.petals.push({
    a:(i/nP)*Math.PI*2+(rng()-0.5)*0.25,
    len:0.8+rng()*0.45, wid:0.32+rng()*0.22,
    curl:0.3+rng()*0.7, shade:rng(),
  });
  const nL=2+((rng()*3)|0);
  for(let i=0;i<nL;i++) f.leaves.push({t:0.3+rng()*0.45,side:rng()<0.5?-1:1,size:0.5+rng()*0.6,ang:0.5+rng()*0.5});
  const nb=opts.fcount-1;
  for(let i=0;i<nb;i++){
    f.branches.push({
      st:0.45+rng()*0.35, t:0.55+rng()*0.25,
      side:rng()<0.5?-1:1, ang:rng(),
      len:0.6+rng()*0.5, sz:0.45+rng()*0.25,
    });
  }
  return f;
}

/* ================= actions ================= */
function updateCount(){
  document.getElementById('count').textContent=t('count')(flowers.length);
}
function curOpts(){
  return {speed:SL.speed(),thick:SL.thick(),curve:SL.curve(),len:SL.len(),
          fcount:SL.fcount(),size:SL.size()};
}
/* seed drops FROM the click position; flower (with vase) is placed at once,
   growth unlocks when the seed lands (in the vase mouth, if any) */
function plant(x,y,species,preset){
  if(y===undefined||y>groundY()-10) y=groundY()-10;
  const rng=mulberry((Math.random()*1e9)|0);
  const sid=species==='any'?SPECIES[(rng()*SPECIES.length)|0].id:species;
  const st=preset?preset.style:curStyle, va=preset?preset.vase:curVase, fo=preset?preset.form:curForm;
  const f=genFlower(sid,x,(0.7+rng()*0.7)*SL.size(),rng,curOpts(),st,va,fo);
  const vm=vaseMetrics(f);
  const targetY=vm?vm.mouthY:groundY()-4;
  flowers.push(f);
  if(flowers.length>24) flowers.shift();
  seeds.push({x, y:Math.max(0,y), vy:40, rot:Math.random()*6.28, vr:(Math.random()-0.5)*6,
              flower:f, targetY});
  updateCount();
}
document.getElementById('bGrow').onclick=()=>{
  plant(W*(0.15+Math.random()*0.7), H*0.25, curSpecies);
};
document.getElementById('bBouquet').onclick=()=>{
  const n=5+((Math.random()*4)|0);
  const preset={style:curStyle,vase:curVase,form:curForm};
  for(let i=0;i<n;i++) setTimeout(()=>plant(W*(0.12+0.76*(i/(n-1)))+(Math.random()-0.5)*40,H*0.25,'any',preset),i*450);
};
document.getElementById('bClear').onclick=()=>{flowers=[];seeds=[];updateCount();};
cv.addEventListener('click',e=>{
  if(panel.classList.contains('open')) return;
  plant(e.clientX,e.clientY,curSpecies);
});
document.getElementById('bPng').onclick=()=>{
  const ex=document.createElement('canvas');
  ex.width=W*2;ex.height=H*2;
  const g=ex.getContext('2d');
  g.drawImage(cv,0,0,W*2,H*2);
  const a=document.createElement('a');
  a.download='bloom-mo.png';
  a.href=ex.toDataURL('image/png');
  a.click();
};

/* ================= main loop ================= */
let lastT=0;
function tick(time){
  const dt=Math.min(0.05,(time-lastT)/1000||0.016);
  lastT=time;
  for(let i=seeds.length-1;i>=0;i--){
    const s=seeds[i];
    s.vy+=900*dt; s.y+=s.vy*dt; s.rot+=s.vr*dt;
    if(s.y>=s.targetY){
      seeds.splice(i,1);
      if(s.flower&&flowers.includes(s.flower)) s.flower.locked=false;
    }
  }
  if(curBg===5){
    if(rain.length<120&&Math.random()<0.6)
      rain.push({x:Math.random()*(W+40),y:-20});
    for(let i=rain.length-1;i>=0;i--){
      const r=rain[i]; r.y+=520*dt; r.x-=120*dt;
      if(r.y>H+20) rain.splice(i,1);
    }
  } else if(rain.length) rain=[];
  // trail particles
  for(let i=trail.length-1;i>=0;i--){
    const p=trail[i];
    p.life-=dt*1.7;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=50*dt;
    if(p.life<=0) trail.splice(i,1);
  }
  // growth + vase pop-in + sway spring physics
  for(const f of flowers){
    if(f.vaseGrow<1) f.vaseGrow=Math.min(1,f.vaseGrow+dt*2.2);
    // failsafe: a locked flower whose seed is gone must not stay frozen
    if(f.locked&&!seeds.some(s=>s.flower===f)) f.locked=false;
    if(!f.locked&&f.grow<1) f.grow=Math.min(1,f.grow+f.growSpeed*dt*3);
    const a=-26*f.swayX-3.4*f.swayV;
    f.swayV+=a*dt; f.swayX+=f.swayV*dt;
  }
  requestAnimationFrame(tick);
}

/* ================= boot ================= */
applyTheme();applyLang();buildSpecies();buildBgs();refreshVals();updateCount();
sizeCanvas();
window.addEventListener('resize',sizeCanvas);
setTimeout(()=>{
  const welcomePreset={style:'watercolor',vase:'none',form:'radial'};
  for(let i=0;i<3;i++)setTimeout(()=>plant(W*(0.25+0.25*i),H*0.25,'any',welcomePreset),i*500);
},600);
requestAnimationFrame(render);
requestAnimationFrame(tick);
</script>
