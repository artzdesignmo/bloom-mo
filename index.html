<!DOCTYPE html>
<html lang="en" data-theme="silver">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloom Mo — Generative Botanical Studio</title>
<meta name="description" content="Bloom Mo: every flower grown from code. Japanese watercolor style, stipple shading.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8e8e6; --panel:#f7f7f5; --card:#ffffff; --ink:#1c1c1e; --ink2:#6b6b6e;
  --line:#d8d8d4; --accent:#2d6a4f; --radius:14px;
}
[data-theme="white"]{ --bg:#f4f4f4; --panel:#ffffff; --card:#ffffff; --ink:#1c1c1e; --ink2:#6b6b6e; --line:#e2e2e2; }
[data-theme="black"]{ --bg:#141414; --panel:#1e1e1e; --card:#242424; --ink:#f2f2f2; --ink2:#a8a8a8; --line:#333; }
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:'Noto Sans TC','Noto Sans',sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; }
h1,.dela{ font-family:'Dela Gothic One',sans-serif; font-weight:400; }
.topbar{ display:flex; align-items:center; justify-content:space-between; padding:14px 22px; position:sticky; top:0; z-index:50; background:var(--bg); border-bottom:1px solid var(--line); }
.brand .t{ font-family:'Dela Gothic One'; font-size:22px; letter-spacing:1px; }
.brand .s{ font-size:11px; color:var(--ink2); letter-spacing:3px; margin-top:2px; }
.hctl{ display:flex; align-items:center; gap:10px; }
.seg{ display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--card); }
.seg button{ border:0; background:transparent; color:var(--ink2); padding:7px 13px; cursor:pointer; font-size:12px; font-weight:500; }
.seg button.on{ background:var(--ink); color:var(--bg); }
.tbtn{ width:32px; height:32px; border-radius:50%; border:1px solid var(--line); cursor:pointer; background:var(--card); font-size:14px; }
.work{ max-width:1200px; margin:0 auto; padding:20px 22px 40px; }
.stage{ position:relative; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
#cv{ display:block; width:100%; height:62vh; min-height:420px; cursor:crosshair; }
.hint{ position:absolute; bottom:12px; left:0; right:0; text-align:center; font-size:12px; color:var(--ink2); pointer-events:none; letter-spacing:1px; text-shadow:0 1px 3px rgba(255,255,255,.8); }
.controls{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:16px; }
.btn{ border:1px solid var(--line); background:var(--card); color:var(--ink); padding:10px 20px; border-radius:999px; cursor:pointer; font-size:14px; font-weight:500; }
.btn:hover{ border-color:var(--ink2); }
.btn.primary{ background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:700; }
.btn.primary:hover{ opacity:.88; }
.species{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
.sp{ border:1px solid var(--line); background:var(--card); border-radius:12px; padding:8px 14px; cursor:pointer; font-size:13px; color:var(--ink2); }
.sp.on{ border-color:var(--accent); color:var(--ink); background:var(--panel); font-weight:600; }
.sp .em{ margin-right:6px; }
.bgs{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.bg{ border:1px solid var(--line); background:var(--card); border-radius:12px; padding:8px 14px; cursor:pointer; font-size:13px; color:var(--ink2); }
.bg.on{ border-color:var(--accent); color:var(--ink); background:var(--panel); font-weight:600; }
.lbl{ font-size:12px; color:var(--ink2); letter-spacing:2px; margin-top:16px; }
.count{ margin-left:auto; font-size:13px; color:var(--ink2); }
footer{ text-align:center; padding:26px; font-size:12px; color:var(--ink2); letter-spacing:1px; }
footer a{ color:var(--ink2); }
@media (max-width:768px){
  .topbar{ padding:10px 14px; } .brand .t{ font-size:18px; }
  .work{ padding:12px 12px 30px; } #cv{ height:52vh; min-height:320px; }
  .btn{ padding:11px 18px; font-size:15px; }
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><div class="t">BLOOM MO</div><div class="s">GENERATIVE BOTANICAL STUDIO</div></div>
  <div class="hctl">
    <div class="seg" id="langSeg"><button data-l="en" class="on">EN</button><button data-l="zh">中</button></div>
    <button class="tbtn" data-th="white" title="white" style="background:#fff"></button>
    <button class="tbtn" data-th="silver" title="silver" style="background:#d8d8d8"></button>
    <button class="tbtn" data-th="black" title="black" style="background:#222"></button>
  </div>
</div>
<div class="work">
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="hint" id="hint"></div>
  </div>
  <div class="controls">
    <button class="btn primary" id="bGrow">🌱 Grow a flower</button>
    <button class="btn" id="bBouquet">💐 Surprise bouquet</button>
    <button class="btn" id="bClear">Clear</button>
    <button class="btn" id="bPng">Export PNG</button>
    <span class="count" id="count"></span>
  </div>
  <div class="lbl" id="lblSpecies">SPECIES</div>
  <div class="species" id="species"></div>
  <div class="lbl" id="lblBg">BACKGROUND</div>
  <div class="bgs" id="bgs"></div>
</div>
<footer>BLOOM MO · <span id="footTx">every flower grown from code</span> · <a href="https://buymeacoffee.com/whynotartmoney" target="_blank" rel="noopener">Buy Me a Coffee</a></footer>
<script>
/* ================= i18n ================= */
const STR={
  en:{grow:'🌱 Grow a flower',bouquet:'💐 Surprise bouquet',clear:'Clear',png:'Export PNG',
      hint:'click the garden to drop a seed · every bloom is unique',foot:'every flower grown from code',
      count:n=>n+(n===1?' bloom':' blooms'),species:'SPECIES',bg:'BACKGROUND',
      bgs:['Sunny sky','Light green','Gray dots','Transparent','Concrete wall','Rainy day','Cloudy']},
  zh:{grow:'🌱 種一朵花',bouquet:'💐 驚喜花束',clear:'清空',png:'匯出 PNG',
      hint:'點擊花園掉下種子 · 每朵都獨一無二',foot:'每朵花都由代碼種出',
      count:n=>n+' 朵花',species:'花種',bg:'背景',
      bgs:['淺藍天晴天','淺綠','淺灰加點點','透明','水泥牆','下雨天','陰天']}
};
let lang='en';
const t=k=>STR[lang][k];
function applyLang(){
  document.documentElement.lang=lang==='zh'?'zh-Hant':'en';
  document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  document.getElementById('bGrow').textContent=t('grow');
  document.getElementById('bBouquet').textContent=t('bouquet');
  document.getElementById('bClear').textContent=t('clear');
  document.getElementById('bPng').textContent=t('png');
  document.getElementById('hint').textContent=t('hint');
  document.getElementById('footTx').textContent=t('foot');
  document.getElementById('lblSpecies').textContent=t('species');
  document.getElementById('lblBg').textContent=t('bg');
  updateCount();buildSpecies();buildBgs();
}
document.querySelectorAll('#langSeg button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;applyLang();});
/* ================= theme ================= */
function applyTheme(th){
  if(th) document.documentElement.dataset.theme=th;
  try{localStorage.setItem('bloommo-theme',document.documentElement.dataset.theme);}catch(e){}
}
document.querySelectorAll('.tbtn').forEach(b=>b.onclick=()=>applyTheme(b.dataset.th));
try{const s=localStorage.getItem('bloommo-theme');if(s)document.documentElement.dataset.theme=s;}catch(e){}

/* ================= species ================= */
const SPECIES=[
  {id:'rose',em:'🌹',en:'Rose',zh:'玫瑰',petals:[24,34],layers:3,shape:'round',cols:[['#a83a4a','#d9707f'],['#c0507a','#e89aac']],center:['#6b2230','#401420'],ink:'#4a1a22'},
  {id:'sakura',em:'🌸',en:'Cherry Blossom',zh:'櫻花',petals:[5,5],layers:1,shape:'notch',cols:[['#e8a0b4','#f7d4dd']],center:['#c94f6d','#8e2f45'],ink:'#7a3040'},
  {id:'sunflower',em:'🌻',en:'Sunflower',zh:'向日葵',petals:[20,28],layers:2,shape:'narrow',cols:[['#d9940d','#f5c542']],center:['#5c3a10','#3d2608'],ink:'#6b4a10'},
  {id:'orchid',em:'🌺',en:'Orchid',zh:'蘭花',petals:[6,6],layers:1,shape:'exotic',cols:[['#8e3aa0','#c47ad4'],['#6b2d8e','#a85fc0']],center:['#f5c542','#d9940d'],ink:'#4a1f5c'},
  {id:'lotus',em:'🪷',en:'Lotus',zh:'蓮花',petals:[14,20],layers:2,shape:'broad',cols:[['#d97a95','#f7c8d4'],['#e8e8e8','#f7f7f7']],center:['#f5c542','#eab308'],ink:'#7a4a55'},
  {id:'lavender',em:'💜',en:'Lavender',zh:'薰衣草',petals:[0,0],layers:0,shape:'spike',cols:[['#7b5fc4','#a88fe0']],center:['#5c4a9b','#3d3270'],ink:'#4a3d7a'},
  {id:'tulip',em:'🌷',en:'Tulip',zh:'鬱金香',petals:[6,6],layers:1,shape:'cup',cols:[['#d94f5c','#f08a92'],['#eab308','#f5d547']],center:['#8e2f45','#5c1f2e'],ink:'#6b2230'},
  {id:'daisy',em:'🌼',en:'Wild Daisy',zh:'野雛菊',petals:[16,24],layers:2,shape:'narrow',cols:[['#f0f0e8','#ffffff']],center:['#eab308','#c47f0a'],ink:'#8a7a4a'},
];
/* 3 stem greens, randomly assigned */
const STEM_GREENS=['#2d6a4f','#3f8f5f','#6ba368'];
/* 3 growth speeds: slow / medium / fast */
const GROW_SPEEDS=[0.006,0.012,0.022];
let curSpecies='any', curBg=0;
function buildSpecies(){
  const el=document.getElementById('species');
  const all={id:'any',em:'🎲',en:lang==='zh'?'隨機':'Random',zh:'隨機'};
  el.innerHTML=[all,...SPECIES].map(s=>
    `<button class="sp${curSpecies===s.id?' on':''}" data-s="${s.id}"><span class="em">${s.em}</span>${lang==='zh'?(s.zh||s.en):s.en}</button>`
  ).join('');
  el.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{curSpecies=b.dataset.s;buildSpecies();});
}
function buildBgs(){
  const el=document.getElementById('bgs');
  el.innerHTML=t('bgs').map((n,i)=>
    `<button class="bg${curBg===i?' on':''}" data-b="${i}">${n}</button>`
  ).join('');
  el.querySelectorAll('.bg').forEach(b=>b.onclick=()=>{curBg=+b.dataset.b;buildBgs();});
}

/* ================= seeded random ================= */
function mulberry(seed){
  let a=seed>>>0;
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
function shadeCol(hex,amt){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  if(amt>=0){r+=(255-r)*amt;g+=(255-g)*amt;b+=(255-b)*amt;}
  else{r*=1+amt;g*=1+amt;b*=1+amt;}
  return `rgb(${r|0},${g|0},${b|0})`;
}
function mixCol(h1,h2,tt){
  const a=parseInt(h1.slice(1),16),b=parseInt(h2.slice(1),16);
  const r=(((a>>16)&255)*(1-tt)+((b>>16)&255)*tt)|0;
  const g=(((a>>8)&255)*(1-tt)+((b>>8)&255)*tt)|0;
  const bl=((a&255)*(1-tt)+(b&255)*tt)|0;
  return `rgb(${r},${g},${bl})`;
}

/* ================= canvas ================= */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let DPR=1,W=0,H=0,flowers=[],seeds=[],rain=[];
function sizeCanvas(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  const r=cv.getBoundingClientRect();
  W=r.width;H=r.height;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
}
function groundY(){ return H*0.92; }

/* ---- stipple: black/white dots for shading (replaces gradients) ---- */
function stipple(g,cx,cy,r,dark,light,rng,ink){
  const n=Math.floor(r*r*0.06);
  for(let i=0;i<n;i++){
    const a=rng()*6.2832, d=Math.sqrt(rng())*r;
    const x=cx+Math.cos(a)*d, y=cy+Math.sin(a)*d;
    // darker toward base (bottom), lighter toward tip
    const shade=(y-cy)/r*0.5+0.5; // 0 top → 1 bottom
    const rr=rng();
    if(rr<shade*dark){
      g.fillStyle=ink; g.globalAlpha=0.28*rng()+0.12;
      g.beginPath();g.arc(x,y,0.7+rng()*1.3,0,6.2832);g.fill();
    }else if(rr>1-(1-shade)*light){
      g.fillStyle='#ffffff'; g.globalAlpha=0.35*rng()+0.15;
      g.beginPath();g.arc(x,y,0.6+rng()*1.1,0,6.2832);g.fill();
    }
  }
  g.globalAlpha=1;
}

/* ---- watercolor petal: translucent wash + ink outline + stipple ---- */
function petal(g,cx,cy,angle,len,wid,col,ink,rng,open,jit){
  g.save();g.translate(cx,cy);g.rotate(angle);
  const L=len*open, Wd=wid*len;
  // watercolor wash: 2 layered translucent fills with jittered edges
  for(let layer=0;layer<2;layer++){
    g.globalAlpha=0.55-layer*0.15;
    g.fillStyle=layer?col[1]:col[0];
    g.beginPath();
    const j=()=> (rng()-0.5)*jit;
    g.moveTo(0,0);
    g.bezierCurveTo(L*0.25+j(),-Wd*0.75+j(), L*0.75+j(),-Wd*0.85+j(), L,-Wd*0.1+j());
    g.bezierCurveTo(L*0.75+j(),Wd*0.85+j(), L*0.25+j(),Wd*0.75+j(), 0,0);
    g.fill();
  }
  g.globalAlpha=1;
  // ink outline (sumi-e touch)
  g.strokeStyle=ink; g.globalAlpha=0.45; g.lineWidth=1.1;
  g.beginPath();
  g.moveTo(0,0);
  g.bezierCurveTo(L*0.3,-Wd*0.7, L*0.7,-Wd*0.8, L*0.96,-Wd*0.08);
  g.stroke();
  g.globalAlpha=1;
  // stipple shading
  const srng=mulberry((rng()*1e9)|0);
  g.save();
  g.beginPath();
  g.moveTo(0,0);
  g.bezierCurveTo(L*0.25,-Wd*0.75, L*0.75,-Wd*0.85, L,-Wd*0.1);
  g.bezierCurveTo(L*0.75,Wd*0.85, L*0.25,Wd*0.75, 0,0);
  g.clip();
  stipple(g,L*0.5,0,L*0.55,0.55,0.4,srng,ink);
  g.restore();
  g.restore();
}

function drawFlower(g,f,time){
  const sp=SPECIES.find(s=>s.id===f.sp);
  const S=f.scale, gy=groundY();
  const sway=Math.sin(time*0.001+f.swayPh)*4*S;
  const bx=f.x+sway, by=gy;
  const stemTopY=gy-f.stemLen*H*0.52*f.grow;
  const stemTopX=bx+f.stemLean*60*S*f.grow;
  const rng=mulberry(f.seed);
  // stem: watercolor stroke (two overlapping translucent lines)
  g.lineCap='round';
  for(let li=0;li<2;li++){
    g.globalAlpha=0.75-li*0.25;
    g.strokeStyle=li?shadeCol(f.stemGreen,0.2):f.stemGreen;
    g.lineWidth=Math.max(1.5,(6-li*2)*S*f.grow);
    g.beginPath(); g.moveTo(bx+li*1.5,by);
    g.quadraticCurveTo(bx+f.stemLean*30*S+li, by-(gy-stemTopY)*0.6, stemTopX, stemTopY);
    g.stroke();
  }
  g.globalAlpha=1;
  // leaves
  for(const l of f.leaves){
    if(f.grow<l.t) continue;
    const lt=Math.min(1,(f.grow-l.t)/(1-l.t)*2);
    const lx=bx+f.stemLean*30*S*l.t*2, ly=by-(gy-stemTopY)*l.t;
    const ls=l.size*46*S*lt;
    if(ls<2)continue;
    g.save();g.translate(lx,ly);g.rotate(l.side*(l.ang+0.4));
    g.globalAlpha=0.7; g.fillStyle=f.stemGreen;
    g.beginPath();
    g.moveTo(0,0);
    g.bezierCurveTo(ls*0.4,-ls*0.35, ls*0.9,-ls*0.25, ls,0);
    g.bezierCurveTo(ls*0.9,ls*0.25, ls*0.4,ls*0.35, 0,0);
    g.fill();
    g.globalAlpha=0.4; g.strokeStyle=sp.ink; g.lineWidth=1;
    g.beginPath();g.moveTo(2,0);g.lineTo(ls*0.85,0);g.stroke();
    g.globalAlpha=1;
    const lrng=mulberry((f.seed+l.size*99)|0);
    g.save();
    g.beginPath();
    g.moveTo(0,0);
    g.bezierCurveTo(ls*0.4,-ls*0.35, ls*0.9,-ls*0.25, ls,0);
    g.bezierCurveTo(ls*0.9,ls*0.25, ls*0.4,ls*0.35, 0,0);
    g.clip();
    stipple(g,ls*0.5,0,ls*0.5,0.4,0.25,lrng,sp.ink);
    g.restore();g.restore();
  }
  if(f.grow<0.55) return;
  const bloomP=Math.min(1,(f.grow-0.55)/0.45);
  const ease=1-Math.pow(1-bloomP,3);
  const col=sp.cols[f.seed%sp.cols.length];
  const R=52*S*ease;
  if(sp.shape==='spike'){
    for(const b of f.buds){
      if(bloomP<b.t*0.7) continue;
      const px=stemTopX+(b.c-0.5)*10*S, py=stemTopY-(b.t*90*S)*((bloomP-b.t*0.7)/0.3+0.7);
      const br=(5+b.s*4)*S*Math.min(1,(bloomP-b.t*0.7)*3);
      if(br<=1)continue;
      g.globalAlpha=0.75;
      g.fillStyle=mixCol(col[0],col[1],b.c);
      g.beginPath();g.ellipse(px,py,br*0.7,br,(b.c-0.5),0,6.2832);g.fill();
      g.globalAlpha=1;
    }
    return;
  }
  const cx=stemTopX, cy=stemTopY;
  const layers=sp.layers||1;
  for(let li=layers-1;li>=0;li--){
    const lr=1-li*0.28;
    const n=Math.max(3,Math.round(f.petals.length/layers));
    for(let i=0;i<n;i++){
      const p=f.petals[(li*n+i)%f.petals.length];
      const open=ease*(li===0?1:0.72);
      const prng=mulberry((f.seed+i*77+li*31)|0);
      petal(g,cx,cy,p.a+(li*0.35),R*p.len*lr,p.wid,col,sp.ink,prng,open,3);
    }
  }
  const cr=R*0.30*ease;
  if(cr>1){
    g.globalAlpha=0.85;
    g.fillStyle=sp.center[0];
    g.beginPath();g.arc(cx,cy,cr,0,6.2832);g.fill();
    g.globalAlpha=1;
    const crng=mulberry((f.seed+999)|0);
    g.save();g.beginPath();g.arc(cx,cy,cr,0,6.2832);g.clip();
    stipple(g,cx,cy,cr,0.5,0.2,crng,sp.ink);
    g.restore();
    g.strokeStyle=sp.ink;g.globalAlpha=0.5;g.lineWidth=Math.max(1,1.4*S);
    const nSt=8;
    for(let i=0;i<nSt;i++){
      const a=(i/nSt)*6.2832+f.seed;
      g.beginPath();g.moveTo(cx+Math.cos(a)*cr*0.4,cy+Math.sin(a)*cr*0.4);
      g.lineTo(cx+Math.cos(a)*cr*1.5,cy+Math.sin(a)*cr*1.5);g.stroke();
      g.globalAlpha=0.9;g.fillStyle=sp.center[1];
      g.beginPath();g.arc(cx+Math.cos(a)*cr*1.5,cy+Math.sin(a)*cr*1.5,Math.max(1,2.4*S),0,6.2832);g.fill();
      g.globalAlpha=0.5;
    }
    g.globalAlpha=1;
  }
}

/* ---- seed: drops first, flower grows on landing ---- */
function drawSeed(g,s){
  g.save();g.translate(s.x,s.y);g.rotate(s.rot);
  g.fillStyle='#5c4a32';
  g.beginPath();g.ellipse(0,0,4.5,6.5,0,0,6.2832);g.fill();
  g.fillStyle='#7a6248';
  g.beginPath();g.ellipse(-1,-1.5,2,3,0.3,0,6.2832);g.fill();
  g.restore();
}

/* ================= backgrounds ================= */
function drawBackground(g,time){
  const th=document.documentElement.dataset.theme;
  const dark=th==='black';
  if(curBg===3){ // transparent → checkerboard hint
    g.fillStyle=dark?'#1a1a1a':'#f0f0f0';g.fillRect(0,0,W,H);
    g.fillStyle=dark?'#222':'#e2e2e2';
    const s=28;
    for(let y=0;y<H/s;y++)for(let x=0;x<W/s;x++)
      if((x+y)%2===0)g.fillRect(x*s,y*s,s,s);
  }else if(curBg===0){ // sunny light blue sky
    g.fillStyle=dark?'#16202c':'#cfe8f5';g.fillRect(0,0,W,H);
    const sg=g.createRadialGradient(W*0.82,H*0.16,10,W*0.82,H*0.16,H*0.45);
    sg.addColorStop(0,'rgba(255,240,180,.9)');sg.addColorStop(1,'rgba(255,240,180,0)');
    g.fillStyle=sg;g.fillRect(0,0,W,H);
    g.fillStyle=dark?'#ffdf80':'#f5c542';
    g.beginPath();g.arc(W*0.82,H*0.16,34,0,6.2832);g.fill();
    // soft clouds
    g.fillStyle=dark?'rgba(255,255,255,.08)':'rgba(255,255,255,.75)';
    for(let i=0;i<3;i++){
      const cx=((time*0.008*(i+1))%(W+300))-150, cy=H*(0.12+i*0.09);
      g.beginPath();
      g.ellipse(cx,cy,70,22,0,0,6.2832);
      g.ellipse(cx+40,cy+6,50,18,0,0,6.2832);
      g.ellipse(cx-40,cy+6,50,18,0,0,6.2832);
      g.fill();
    }
  }else if(curBg===1){ // light green
    g.fillStyle=dark?'#14231a':'#e2f0da';g.fillRect(0,0,W,H);
  }else if(curBg===2){ // light gray with dots
    g.fillStyle=dark?'#1e1e1e':'#e8e8e8';g.fillRect(0,0,W,H);
    g.fillStyle=dark?'rgba(255,255,255,.10)':'rgba(0,0,0,.10)';
    for(let y=14;y<H;y+=28)for(let x=14;x<W;x+=28){
      g.beginPath();g.arc(x,y,1.6,0,6.2832);g.fill();
    }
  }else if(curBg===4){ // concrete wall
    g.fillStyle=dark?'#232323':'#cfcfcb';g.fillRect(0,0,W,H);
    const rng=mulberry(42);
    for(let i=0;i<900;i++){
      g.fillStyle=rng()<0.5?'rgba(0,0,0,.05)':'rgba(255,255,255,.06)';
      g.fillRect(rng()*W,rng()*H,1+rng()*3,1+rng()*3);
    }
    g.strokeStyle='rgba(0,0,0,.08)';g.lineWidth=1;
    for(let i=0;i<4;i++){
      g.beginPath();
      let x=rng()*W,y=rng()*H*0.5;
      g.moveTo(x,y);
      for(let k=0;k<5;k++){x+=(rng()-0.5)*60;y+=rng()*40;g.lineTo(x,y);}
      g.stroke();
    }
  }else if(curBg===5){ // rainy day
    g.fillStyle=dark?'#1a222c':'#b9c8d4';g.fillRect(0,0,W,H);
    g.strokeStyle=dark?'rgba(180,200,220,.35)':'rgba(90,110,130,.35)';
    g.lineWidth=1.2;
    for(const r of rain){
      g.beginPath();g.moveTo(r.x,r.y);g.lineTo(r.x-3,r.y+14);g.stroke();
    }
  }else if(curBg===6){ // cloudy
    g.fillStyle=dark?'#20242a':'#d4d8dc';g.fillRect(0,0,W,H);
    g.fillStyle=dark?'rgba(255,255,255,.06)':'rgba(255,255,255,.5)';
    for(let i=0;i<5;i++){
      const cx=W*(0.1+i*0.2), cy=H*(0.1+((i*37)%40)/100);
      g.beginPath();
      g.ellipse(cx,cy,90,26,0,0,6.2832);
      g.ellipse(cx+50,cy+8,60,20,0,0,6.2832);
      g.ellipse(cx-50,cy+8,60,20,0,0,6.2832);
      g.fill();
    }
  }
  // ground shadow
  if(curBg!==3){
    g.fillStyle=dark?'rgba(0,0,0,.25)':'rgba(60,80,60,.14)';
    g.beginPath();g.ellipse(W/2,groundY()+H*0.05,W*0.72,H*0.075,0,0,6.2832);g.fill();
  }
}

function render(time){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawBackground(ctx,time);
  const sorted=[...flowers].sort((a,b)=>a.scale-b.scale);
  for(const f of sorted) drawFlower(ctx,f,time);
  for(const s of seeds) drawSeed(ctx,s);
  requestAnimationFrame(render);
}

/* ================= flower generation ================= */
function genFlower(speciesId,x,scale,rng){
  const sp=SPECIES.find(s=>s.id===speciesId)||SPECIES[(rng()*SPECIES.length)|0];
  const f={
    sp:sp.id, x, scale,
    seed:(rng()*1e9)|0,
    stemLean:(rng()-0.5)*0.5,
    stemLen:0.75+rng()*0.4,
    stemGreen:STEM_GREENS[(rng()*3)|0],
    growSpeed:GROW_SPEEDS[(rng()*3)|0],
    petals:[],leaves:[],buds:[],
    grow:0, swayPh:rng()*6.28,
  };
  const nP=sp.petals[0]+((rng()*(sp.petals[1]-sp.petals[0]+1))|0);
  for(let i=0;i<nP;i++) f.petals.push({
    a:(i/nP)*Math.PI*2+(rng()-0.5)*0.25,
    len:0.8+rng()*0.45, wid:0.32+rng()*0.22,
    curl:0.3+rng()*0.7, shade:rng(),
  });
  const nL=2+((rng()*3)|0);
  for(let i=0;i<nL;i++) f.leaves.push({t:0.3+rng()*0.45,side:rng()<0.5?-1:1,size:0.5+rng()*0.6,ang:0.5+rng()*0.5});
  if(sp.shape==='spike'){
    const nb=10+((rng()*8)|0);
    for(let i=0;i<nb;i++) f.buds.push({t:0.15+0.85*(i/nb),s:0.5+rng()*0.5,c:rng()});
  }
  return f;
}

/* ================= actions ================= */
function updateCount(){
  document.getElementById('count').textContent=t('count')(flowers.length);
}
/* drop a seed → on landing, flower grows */
function dropSeed(x,species){
  seeds.push({x, y:-12, vy:60, rot:Math.random()*6.28, vr:(Math.random()-0.5)*6, species});
}
function plant(x,species){
  dropSeed(x,species);
}
document.getElementById('bGrow').onclick=()=>{
  plant(W*(0.15+Math.random()*0.7),curSpecies);
};
document.getElementById('bBouquet').onclick=()=>{
  const n=5+((Math.random()*4)|0);
  for(let i=0;i<n;i++) setTimeout(()=>plant(W*(0.12+0.76*(i/(n-1)))+(Math.random()-0.5)*40,'any'),i*450);
};
document.getElementById('bClear').onclick=()=>{flowers=[];seeds=[];updateCount();};
cv.addEventListener('click',e=>{
  const r=cv.getBoundingClientRect();
  plant(e.clientX-r.left,curSpecies);
});
document.getElementById('bPng').onclick=()=>{
  const ex=document.createElement('canvas');
  ex.width=W*2;ex.height=H*2;
  const g=ex.getContext('2d');
  g.drawImage(cv,0,0,W*2,H*2);
  const a=document.createElement('a');
  a.download='bloom-mo.png';
  a.href=ex.toDataURL('image/png');
  a.click();
};

/* ================= main loop: seeds fall, flowers grow ================= */
let lastT=0;
function tick(time){
  const dt=Math.min(0.05,(time-lastT)/1000||0.016);
  lastT=time;
  // seeds
  for(let i=seeds.length-1;i>=0;i--){
    const s=seeds[i];
    s.vy+=900*dt; s.y+=s.vy*dt; s.rot+=s.vr*dt;
    if(s.y>=groundY()-4){
      seeds.splice(i,1);
      const rng=mulberry((Math.random()*1e9)|0);
      const sid=s.species==='any'?SPECIES[(rng()*SPECIES.length)|0].id:s.species;
      const f=genFlower(sid,s.x,0.7+rng()*0.7,rng);
      flowers.push(f);
      if(flowers.length>24) flowers.shift();
      updateCount();
    }
  }
  // rain
  if(curBg===5){
    if(rain.length<120&&Math.random()<0.6)
      rain.push({x:Math.random()*(W+40),y:-20});
    for(let i=rain.length-1;i>=0;i--){
      const r=rain[i]; r.y+=520*dt; r.x-=120*dt;
      if(r.y>H+20) rain.splice(i,1);
    }
  } else if(rain.length) rain=[];
  // growth
  for(const f of flowers){
    if(f.grow<1) f.grow=Math.min(1,f.grow+f.growSpeed*dt*3);
  }
  requestAnimationFrame(tick);
}

/* ================= boot ================= */
applyTheme();applyLang();buildSpecies();buildBgs();updateCount();
sizeCanvas();
window.addEventListener('resize',sizeCanvas);
setTimeout(()=>{for(let i=0;i<3;i++)setTimeout(()=>plant(W*(0.25+0.25*i),'any'),i*500);},600);
requestAnimationFrame(render);
requestAnimationFrame(tick);
</script>
